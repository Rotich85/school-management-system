<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>School Management Login</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef3f9;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.login-box {
    width: 90%;
    max-width: 400px;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.15);
}

h1 {
    text-align: center;
    color: #174ea6;
}

p {
    text-align: center;
}

label {
    font-weight: bold;
    display: block;
    margin-top: 15px;
}

input {
    width: 100%;
    padding: 13px;
    margin-top: 7px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 20px;
    border: none;
    border-radius: 6px;
    background: #174ea6;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #0d3b7d;
}

#error {
    color: red;
    text-align: center;
    margin-top: 15px;
}

</style>
</head>

<body>

<div class="login-box">

<h1>🏫 School System</h1>

<p>Staff Login</p>

<label>Username</label>

<input
type="text"
id="username"
placeholder="Enter username"
>

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter password"
>

<button onclick="login()">
🔐 Login
</button>

<div id="error"></div>

</div>


<script>

function login() {

let username =
document.getElementById("username").value;

let password =
document.getElementById("password").value;


/*
DEMO LOGIN ONLY

We will replace this
with real secure authentication
later.
*/

if (
username === "admin" &&
password === "1234"
) {

window.location.href = "index.html";

} else {

document.getElementById("error").innerText =
"Incorrect username or password.";

}

}

</script>

</body>
</html>
